[package]
name = "biguansim"
version = "0.1.0"
description = "闭关模拟器：自愿设定时长后全屏接管电脑的本地工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "biguansim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = ["std"] }

[target.'cfg(windows)'.dependencies]
# 只开用到的 feature；纯 Win32 声明，不引入 COM 封装
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
